name: Prepare dashboard scale fix
on:
  push:
    branches: [fix/dashboard-chart-ceiling-20261012]
    paths: [tests/dashboard-chart-browser.cjs]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-chart-ceiling-20261012
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the reviewed scale change and rotate the existing build tags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess
          path = Path('src/features/charts/polish.js')
          assert subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip() == '0017264c5a21f7b6ef705e1382edfc5d1b85945f', 'Chart owner changed; review before applying'
          source = path.read_text()
          start = source.index('    var target=Math.max(2,targetIntervals||3),paddedMax=')
          end = source.index('  function fmtAxisMoney(', start)
          replacement = '''    // The ceiling follows the plotted values, not the (much coarser) grid step.
              // A 5% pad followed by grid rounding could turn a £1,950 peak into £3,000.
              var target=Math.max(2,targetIntervals||3);
              var unit=rawMax>=100?100:rawMax>=10?10:rawMax>=1?1:rawMax>=.1?.1:.01;
              var yMax=rawMax>0?Math.max(unit,Math.ceil((rawMax-1e-9)/unit)*unit):0;
              yMax=Number(yMax.toFixed(2));
              var paddedMin=rawMin<0?rawMin*1.05:0;
              var step=niceStep((yMax-paddedMin)/target||1);
              var yMin=rawMin<0?Math.floor(paddedMin/step)*step:0;
              if(yMax<=yMin)yMax=yMin+step;
              if((yMax-yMin)/step>target+1){
                step=nextNiceStep(step);
                yMin=rawMin<0?Math.floor(paddedMin/step)*step:0;
              }
              var ticks=[yMin],intervals=Math.ceil((yMax-yMin)/step);
              for(var i=1;i<intervals;i++){
                var tick=Number((yMin+i*step).toFixed(8));
                // Keep the exact ceiling labelled without crowding it with a nearby tick.
                if(tick<yMax&&(yMax-tick>=step*.5||Math.abs(tick)<step*.001))ticks.push(tick);
              }
              ticks.push(yMax);
              return {min:yMin,max:yMax,step:step,ticks:ticks};
            }
          '''
          source = source[:start] + replacement + source[end:]
          assert source.count('k.toFixed(k>=10||') == 1
          source = source.replace('k.toFixed(k>=10||', 'k.toFixed(')
          path.write_text(source)
          manifest = Path('config/assets.js')
          contract = manifest.read_text()
          old = re.search(r'"build": "([^"]+)"', contract).group(1)
          staging = '"environment": "staging"' in contract
          assert old == ('20261008-monitor-continuity-staging' if staging else '20261006-v15104'), 'Build changed; review before applying'
          new = '20261012-chart-scale' + ('-staging' if staging else '')
          for path in [manifest, Path('index.html')]:
              text = path.read_text()
              assert old in text, 'Expected existing build tag in ' + str(path)
              path.write_text(text.replace(old, new))
          package = Path('package.json')
          data = json.loads(package.read_text())
          data['scripts']['check'] = 'node tests/dashboard-chart-scale.cjs && ' + data['scripts']['check']
          data['scripts']['test'] = 'node tests/dashboard-chart-browser.cjs && ' + data['scripts']['test']
          package.write_text(json.dumps(data, indent=2) + '\n')
          Path('.github/workflows/prepare-dashboard-scale.yml').unlink()
          print('Applied dashboard-only scale fix; build', old, '->', new)
          PY
      - run: npm run check
      - run: npm run build
      - name: Commit only the focused patch to its working branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/charts/polish.js config/assets.js index.html package.json tests/dashboard-chart-scale.cjs tests/dashboard-chart-browser.cjs .github/workflows/prepare-dashboard-scale.yml
          git commit -m 'fix(charts): cap dashboard scale at the next hundred above plotted values'
          git push origin HEAD:fix/dashboard-chart-ceiling-20261012
