name: Remove legacy local preview fixtures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-remove-legacy-preview.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove obsolete in-code preview dataset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core_path=Path('app-core.js')
          core=core_path.read_text(encoding='utf-8')

          # The legacy preview dataset pre-dates real staging. Keep a permanently
          # false compatibility flag because generic save/sync guards still read
          # it, but remove the localStorage/query activation state and the entire
          # browser-memory preview database builder.
          old="""let _previewMode = false;
          const _previewParam = new URLSearchParams(window.location.search).get('preview');
          const PREVIEW_STORAGE_KEY='retrade_preview_mode';
          const LEGACY_PREVIEW_STORAGE_KEYS=['general_preview_mode'];
          const _previewStored = localStorage.getItem(PREVIEW_STORAGE_KEY) === '1' || LEGACY_PREVIEW_STORAGE_KEYS.some(function(k){ return localStorage.getItem(k) === '1'; });
          const PREVIEW_MODE_ENABLED = false; // Dev: true / Push: false — controls preview-btn visibility, startPreviewMode guard, and localStorage hardening below.
          """
          new="""const _previewMode = false;
          const PREVIEW_MODE_ENABLED = false; // Legacy browser preview removed; staging data now lives in isolated Supabase.
          """
          if old not in core:
              raise SystemExit('Could not locate legacy preview declaration block')
          core=core.replace(old,new,1)

          cleanup_start="""if(!PREVIEW_MODE_ENABLED){
            try{
              localStorage.removeItem(PREVIEW_STORAGE_KEY);"""
          start=core.find(cleanup_start)
          fixture=core.find('function _buildPreviewDB(){')
          if start < 0 or fixture < 0 or fixture <= start:
              raise SystemExit('Could not locate preview storage/bootstrap block')
          core=core[:start]+core[fixture:]

          fixture=core.find('function _buildPreviewDB(){')
          eye=core.find('const _EYE_OPEN =',fixture)
          if fixture < 0 or eye < 0:
              raise SystemExit('Could not locate preview fixture boundary')
          core=core[:fixture]+core[eye:]

          start=core.find('function startPreviewMode(){')
          end=core.find('function _pwToggle(',start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate startPreviewMode boundary')
          core=core[:start]+core[end:]

          start=core.find('async function doSignOut(){\n  if(_previewMode){')
          end=core.find('  // If a sync is actively running',start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate preview sign-out branch')
          core=core[:start]+'async function doSignOut(){\n'+core[end:]

          gate="""  // Gate: hide dev bypass button unless this is a dev build
            const _pb = document.getElementById('preview-btn');
            if(_pb) _pb.style.display = PREVIEW_MODE_ENABLED ? 'block' : 'none';
          """
          core=core.replace(gate,'',1)

          # These symbols define the old browser fixture feature itself. Other
          # regression tests may legitimately contain place names or pv-like
          # labels, so don't reject unrelated test strings globally.
          for forbidden in ('function _buildPreviewDB(){','function startPreviewMode(){','PREVIEW_STORAGE_KEY','LEGACY_PREVIEW_STORAGE_KEYS','_previewParam','_previewStored'):
              if forbidden in core:
                  raise SystemExit('Legacy preview mechanism still present: '+forbidden)
          core_path.write_text(core,encoding='utf-8')

          index_path=Path('index.html')
          index=index_path.read_text(encoding='utf-8')
          start=index.find('    <button onclick="startPreviewMode()" id="preview-btn"')
          if start < 0:
              raise SystemExit('Could not locate legacy preview login button')
          end=index.find('    </button>',start)
          if end < 0:
              raise SystemExit('Could not locate legacy preview button end')
          end += len('    </button>')
          if end < len(index) and index[end]=='\n': end += 1
          index=index[:start]+index[end:]
          if 'preview-btn' in index or 'startPreviewMode()' in index:
              raise SystemExit('Legacy preview UI still present in index.html')
          index_path.write_text(index,encoding='utf-8')
          PY

          node --check app-core.js

      - name: Commit cleanup and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RETRADE staging maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/oneoff-remove-legacy-preview.yml
          git add app-core.js index.html
          git commit -m 'Remove obsolete browser preview fixture data'
          git push origin HEAD:main
