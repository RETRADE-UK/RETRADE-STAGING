name: Prepare chart label gutter
on:
  push:
    branches: [fix/dashboard-headroom-20261013]
    paths: [.github/workflows/prepare-chart-label-gutter.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('src/features/charts/polish.js')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='f90d6454fef5b2d2646e4a5b97c30bea1fe6e267'
          s=p.read_text()
          old='    var scale=buildScale(revData,profitData,refunds,mobile?(H<215?2:3):4,forecast);'
          assert s.count(old)==1
          s=s.replace(old,old+'''
              // Refined money labels can have an extra digit; keep them inside the SVG.
              var labelChars=scale.ticks.reduce(function(longest,v){return Math.max(longest,fmtAxisMoney(v).length);},0);
              pad.l=Math.max(pad.l,Math.ceil(fontSize*(labelChars*.65+.9)+4));
              innerW=W-pad.l-pad.r;bandW=innerW/Math.max(1,n);''')
          p.write_text(s)
          Path('.github/workflows/prepare-chart-label-gutter.yml').unlink()
          PY
      - run: npm run check
      - run: npm run build
      - run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/charts/polish.js .github/workflows/prepare-chart-label-gutter.yml
          git commit -m 'fix(charts): fit refined money labels within the chart gutter'
          git push origin HEAD:fix/dashboard-headroom-20261013
