name: Prepare dashboard headroom patch
on:
  push:
    branches: [fix/dashboard-headroom-20261013]
    paths: [.github/workflows/prepare-dashboard-headroom.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the reviewed chart diff and rotate existing asset tags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          def blob(path):
              return subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
          p=Path('src/features/charts/polish.js')
          assert blob(p)=='972c185782c9d4c9b76f21bd12867f9dc1945ac9', 'Chart owner changed; review required'
          assert blob('tests/dashboard-chart-scale.cjs')=='592bcbd0d4b6304fa67830f8ec4ccdc620b72dd3'
          assert blob('tests/dashboard-chart-browser.cjs')=='80ca46e584dcb7bf65b46541c429cad34419ea7c'
          s=p.read_text()
          old='''    // The ceiling follows the plotted values, not the (much coarser) grid step.
              // A 5% pad followed by grid rounding could turn a £1,950 peak into £3,000.
              var target=Math.max(2,targetIntervals||3);
              var unit=rawMax>=100?100:rawMax>=10?10:rawMax>=1?1:rawMax>=.1?.1:.01;
              var yMax=rawMax>0?Math.max(unit,Math.ceil((rawMax-1e-9)/unit)*unit):0;'''
          new='''    // Add 5% breathing room, independently of the much coarser grid step.
              // Prefer round hundreds, but refine the increment when rounding would add
              // more than 10% above the peak. One penny is the minimum money increment.
              var target=Math.max(2,targetIntervals||3);
              var paddedMax=rawMax>0?rawMax*1.05:0;
              var unit=rawMax>=100?100:rawMax>=10?10:rawMax>=1?1:rawMax>=.1?.1:.01;
              while(unit>.01&&Math.ceil((paddedMax-1e-9)/unit)*unit>rawMax*1.10+1e-9)unit/=10;
              var yMax=rawMax>0?Math.max(unit,Math.ceil((paddedMax-1e-9)/unit)*unit):0;'''
          assert s.count(old)==1
          s=s.replace(old,new)
          start=s.index('    if(a>=1000000){var m=a/1000000;')
          end=s.index('\n  function fmtForecastMoney(',start)
          s=s[:start]+'''    // Preserve the refined ceiling in the label (e.g. £1.11k, not £1.1k).
              if(a>=1000000)return sign+'£'+Number((a/1000000).toFixed(4))+'m';
              if(a>=1000)return sign+'£'+Number((a/1000).toFixed(2))+'k';
              return sign+'£'+Number(a.toFixed(2));
            }'''+s[end:]
          p.write_text(s)
          manifest=Path('config/assets.js')
          contract=manifest.read_text()
          staging='"environment": "staging"' in contract
          old='20261012-chart-scale'+('-staging' if staging else '')
          new='20261013-chart-headroom'+('-staging' if staging else '')
          assert re.search(r'"build": "([^"]+)"',contract).group(1)==old
          for p in [manifest,Path('index.html')]:
              text=p.read_text()
              assert old in text
              p.write_text(text.replace(old,new))
          p=Path('docs/RUNTIME_MAP.md')
          p.write_text(p.read_text()+'''
          
          ## Dashboard headroom refinement — 13 October 2026
          
          `src/features/charts/polish.js` remains the sole dashboard geometry owner.
          Add 5% above the largest positive plotted value before rounding. Prefer the
          existing round-money increment, refining it when it would exceed 10% total
          headroom (minimum increment: one penny). Grid spacing cannot inflate this
          ceiling. Zero baselines, negative bounds, refunds and FY forecasts remain.
          Refined ceilings retain accurate labels; accounting inputs are not changed.
          Examples: GBP 1,900 -> 2,000; GBP 1,950 -> 2,100; GBP 2,000 -> 2,100.
          
          Existing cache/version behaviour is unchanged. Rotate the manifest and all
          HTML asset tags together to `20261013-chart-headroom` (staging: `-staging`).
          Scale tests cover 1,104 cases; browser tests measure the visible gap on mobile
          and desktop, as well as sparse forecasts and redraws. All data is synthetic.
          Design reference: https://www.chartjs.org/docs/latest/axes/cartesian/linear.html#grace
          The 5% target and 10% rounding cap are RETRADE presentation choices; no new
          chart dependency is introduced.
          ''')
          Path('.github/workflows/prepare-dashboard-headroom.yml').unlink()
          PY
      - run: npm run check
      - run: npm run build
      - name: Commit only this isolated patch, never main
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/charts/polish.js config/assets.js index.html docs/RUNTIME_MAP.md .github/workflows/prepare-dashboard-headroom.yml
          git commit -m 'fix(charts): add bounded breathing room above dashboard peaks'
          git push origin HEAD:fix/dashboard-headroom-20261013
