name: Prepare reviewed stock fixes
on:
  push:
    branches: [fix/stock-performance-release-20261014]
    paths: [scripts/stock-performance-release.patch]
permissions:
  contents: write
concurrency:
  group: stock-performance-release-staging
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'RETRADE-UK/RETRADE-STAGING'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stock-performance-release-20261014
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate and apply the reviewed plain-text patch
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = '404b9bf3c855fc3267c40df41e071d868b481f18'
          test "$(git hash-object src/core/application.js)" = 'cb285a169b3526d623ba54daf556d4b053916b9f'
          echo '649d31e50db7fddaeb7c7b279ea585f56ef6205e734b6357f569639d05d0edfd  scripts/stock-performance-release.patch' | sha256sum --check
          git apply --check --whitespace=error scripts/stock-performance-release.patch
          git apply --index --whitespace=error scripts/stock-performance-release.patch
          python3 - <<'PY'
          import subprocess
          expected = {'assets/styles/workspaces.css','config/assets.js','docs/RUNTIME_MAP.md','index.html','package.json','src/core/application.js','src/features/charts/polish.js','tests/dashboard-chart-browser.cjs','tests/dashboard-chart-scale.cjs','tests/stock-performance-browser.cjs','tests/stock-performance.cjs'}
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual == expected, 'Unexpected patch scope'
          PY
          git diff --cached --check
          git diff --cached --stat
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Commit tested source to the release branch only
        run: |
          set -euo pipefail
          git fetch origin main fix/stock-performance-release-20261014
          test "$(git rev-parse origin/main)" = '404b9bf3c855fc3267c40df41e071d868b481f18'
          test "$(git rev-parse origin/fix/stock-performance-release-20261014)" = "$GITHUB_SHA"
          git diff --exit-code
          git rm scripts/stock-performance-release.patch .github/workflows/prepare-stock-performance.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: regular chart ticks, reconciled months and stable stock actions'
          git push origin HEAD:refs/heads/fix/stock-performance-release-20261014
