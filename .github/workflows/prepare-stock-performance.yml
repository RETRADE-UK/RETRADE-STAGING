name: Prepare scoped Stock and Performance patch
on:
  push:
    branches: [fix/stock-performance-polish-20261013]
    paths: [.github/workflows/prepare-stock-performance.yml]
permissions:
  contents: write
concurrency:
  group: prepare-stock-performance
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stock-performance-polish-20261013
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply the exact reviewed staging patch to its isolated branch
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,subprocess,urllib.request
          from pathlib import Path
          assert subprocess.check_output(['git','hash-object','src/core/application.js'],text=True).strip()=='cb285a169b3526d623ba54daf556d4b053916b9f', 'Core changed: review before applying'
          base='https://raw.githubusercontent.com/RETRADE-UK/RETRADE/da5fe0194930f705c4db3f95b71bfcacd330fd6a/scripts/'
          encoded=''.join(urllib.request.urlopen(base+'stock-performance-patch-'+str(n)+'.b64',timeout=30).read().decode().strip() for n in [1,2])
          raw=lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest()=='6f3a5c0d3bce203cd13fe1a4ee31590bfe57b3956b4726f02438f171b5b7c155'
          patch=json.loads(raw)
          subprocess.run(['git','apply','--index','--whitespace=error','-'],input=(patch['common']+patch['staging']).encode(),check=True)
          p=Path('package.json');d=json.loads(p.read_text())
          d['scripts']['test']='node tests/stock-performance-browser.cjs && '+d['scripts']['test']
          d['scripts']['check']='node tests/stock-performance.cjs && '+d['scripts']['check']
          p.write_text(json.dumps(d,indent=2)+'\n')
          p=Path('docs/RUNTIME_MAP.md');p.write_text(p.read_text()+'\n\n## Stock selection and Performance reconciliation — 13 October 2026'+patch['notes'])
          Path('.github/workflows/prepare-stock-performance.yml').unlink()
          PY
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: node tests/dashboard-chart-browser.cjs && node tests/stock-performance-browser.cjs
      - run: npm run build
      - name: Publish only the scoped patch and remove preparation files
        run: |
          git add -u
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: regular chart ticks, reconciled months and stable stock actions'
          git push origin HEAD:refs/heads/fix/stock-performance-polish-20261013
