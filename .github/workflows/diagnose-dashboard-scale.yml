name: Prepare sparse dashboard forecast fix
on:
  push:
    branches: [fix/dashboard-chart-ceiling-20261012]
    paths: [.github/workflows/diagnose-dashboard-scale.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-chart-ceiling-20261012
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct last-bucket lookup without changing forecast calculations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('src/features/charts/polish.js')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='2bc3fa58888785dec63ef4fb99c90f0006650c4a'
          s=p.read_text()
          old='    var revRect=revenueBars[last]||null,profitRect=profitBars[last]||null;'
          new='''    // Zero-value buckets have no rectangle; DOM position is not the data index.
              // Match the original bucket so a missing earlier month cannot hide the forecast.
              var revRect=Array.prototype.find.call(revenueBars,function(rect){return parseBarIndex(rect)===last;})||null;
              var profitRect=Array.prototype.find.call(profitBars,function(rect){return parseBarIndex(rect)===last;})||null;'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          p=Path('tests/dashboard-chart-browser.cjs')
          s=p.read_text()
          anchor='   assert.deepEqual(errors,[]);await context.close();'
          regression='''   const sparse=await page.evaluate(()=>{
              const svg=Array.from(document.querySelectorAll('#p-summary svg')).find(s=>s.getClientRects().length&&s.__rtPolishedSnapshot);
              const options=Object.assign({},svg.__rtPolishedSnapshot.opts,{partialLast:true,drawKey:'current_fy',tertiaryData:[0,0,0,0],tertiaryCounts:[0,0,0,0]});
              SUMMARY_PERIOD='current_fy';
              _renderChartInto(svg,['Apr','May','Jun','Jul'],[0,80,0,45],[0,0,0,15],[],options);
              const index=el=>Number(el.style.getPropertyValue('--bar-i'));
              const top=Math.min(...Array.from(svg.querySelectorAll('.rt-polished-axis line'),el=>Number(el.getAttribute('y1'))));
              const shells=Array.from(svg.querySelectorAll('.rt-chart-forecast-shell'));
              return {forecastIndices:shells.map(index),actualIndices:Array.from(svg.querySelectorAll('.rt-chart-actual-overlay'),index),withinScale:shells.every(el=>Number(el.getAttribute('y'))>=top-.1)};
             });
             assert.deepEqual(sparse.forecastIndices,[3,3],'Empty earlier buckets must not hide the current-month forecast');
             assert.deepEqual(sparse.actualIndices,[3,3],'Keep actual overlays on the same final bucket');
             assert(sparse.withinScale,'The tight ceiling must contain every visible forecast');
          '''
          assert s.count(anchor)==1
          p.write_text(s.replace(anchor,regression+anchor))
          PY
      - run: npm run check
      - run: npm run build
      - name: Commit only the runtime lookup and its regression test
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/charts/polish.js tests/dashboard-chart-browser.cjs
          git commit -m 'fix(charts): match forecast bars by bucket when earlier months are empty'
          git push origin HEAD:fix/dashboard-chart-ceiling-20261012
