name: Partner schema migrations
on:
  pull_request:
    paths:
      - 'supabase/migrations/20260914122441_add_partner_arrangement_model_v2.sql'
      - 'supabase/migrations/20261123221855_restore_partner_delete_rpc.sql'
      - 'tests/sql/partner-schema.sql'
      - '.github/workflows/partner-schema.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: retrade-fixture
          POSTGRES_DB: partner_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: Exercise partner schema and deletion on disposable records
        run: psql -X --set ON_ERROR_STOP=1 --file tests/sql/partner-schema.sql
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: partner_fixture
          PGUSER: postgres
          PGPASSWORD: retrade-fixture
