name: Deploy RETRADE staging to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build staging site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          for file in CNAME *.html *.js *.css *.png *.webmanifest; do
            if [ -f "$file" ]; then
              cp "$file" _site/
            fi
          done
          test -f _site/index.html
          test -f _site/app.js
          test -f _site/app-core.js
          test -f _site/staging-supabase.js
          test -f _site/staging-dev-auth.js
          test "$(cat _site/CNAME)" = "test.retrade-uk.com"

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
