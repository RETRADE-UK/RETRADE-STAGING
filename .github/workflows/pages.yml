name: Deploy RETRADE staging to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build staging site artifact
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-assets.cjs
          node scripts/build-site.cjs
          for route in login signup dashboard start landing1 landing2; do test -s "_site/$route/index.html"; done
          test -s _site/assets/landing/sourcing-phone.webp
          grep -q 'id="tour-title"' _site/index.html
          test -f _site/src/core/application.js
          test -f _site/src/platform/staging-binding.js
          test ! -d _site/experiments
          test "$(cat _site/CNAME)" = "test.retrade-uk.com"

      # Wait briefly for GitHub's artifact index. The previous staging deploy
      # occasionally failed to find a package it had just uploaded.
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - name: Allow artifact indexing
        run: sleep 12

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
