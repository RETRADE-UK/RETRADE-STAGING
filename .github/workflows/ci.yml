name: RETRADE CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 5
      - run: node tests/dashboard-fortnight-browser.cjs --webkit
      - run: node tests/account-cost-payout-browser.cjs --webkit
      - run: node tests/staging-auth-browser.cjs --webkit
      - run: node tests/bulk-list-browser.cjs --webkit
      - run: node tests/auth-autofill-browser.cjs --webkit
      - run: node tests/dashboard-chart-browser.cjs --webkit
      - run: node tests/bulk-selection-browser.cjs --webkit
      - run: node tests/partner-fixed-upfront-browser.cjs --webkit
      - run: node tests/bundle-fees-browser.cjs --webkit
      - run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-ui-review
          path: /tmp/monitors-*.png
          if-no-files-found: ignore
          retention-days: 7
