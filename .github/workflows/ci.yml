name: RETRADE Staging CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for file in \
            app.js app-core.js accounting.js reports.js sw.js staging-supabase.js staging-dev-auth.js staging-gestures.js gesture-back-v31.js gesture-native-v3.js gesture-native-v3-actions.js gesture-live-tracking.js interaction-system-v2.js surface-gestures-v2.js chart-gesture-v2.js \
            launch-experience.js performance-system.js navigation-stability.js app-lifecycle.js sales-defaults.js account-detail-stability.js \
            bundle-orders.js bundle-panel.js bundle-row-polish.js relist-fee-integrity.js \
            cashflow-liabilities.js cashflow-dashboard-v2.js cashflow-movement-card-polish.js cashflow-performance-v1509.js partner-item-navigation.js partner-actions-v2.js partner-statement-action.js partner-account-ui-v3.js partner-account-ui-v4.js partner-account-cleanup.js partner-row-menu-popover.js partner-statements.js partner-statements-accounting-v2.js partner-statements-accounting-v3.js partner-account-adjustment-statements.js partner-arrangements-v2.js partner-account-finalise.js partner-account-legacy-hero-cleanup.js partner-account-adjustments.js partner-account-adjustments-hardening.js partner-payment-allocations-v2.js partner-account-transaction-ui.js partner-transaction-breakdown-guard.js partner-collapse-defaults.js accounts-operations-dashboard.js accounts-sort-polish.js accounts-operations-compact-v2.js partner-account-experience-v2.js partner-page-unified-v1503.js sales-calendar-layout-v1530.js \
            item-account-adjustments.js document-exports.js \
            chart-polish.js chart-motion.js chart-finalize.js chart-reveal.js \
            sales-chart-sequence.js chart-forecast-sequence.js motion-system.js
          do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Repository safety checks
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch archive/legacy-site/data.json >/dev/null 2>&1; then
            echo "archive/legacy-site/data.json must not be tracked"
            exit 1
          fi

          if git ls-files | grep -E '(^|/)(\.env($|\.)|retrade-(backup|export).*\.json$|.*\.backup\.json$)' ; then
            echo "Potential local secret/business-data backup is tracked"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import re

          failures=[]
          for p in Path('.github/workflows').glob('*.y*ml'):
              if p.name == 'ci.yml':
                  continue
              text=p.read_text(encoding='utf-8')
              if re.search(r'contents\s*:\s*write', text):
                  failures.append(f'{p}: contents: write')
              if re.search(r'(^|\s)git\s+push(\s|$)', text):
                  failures.append(f'{p}: git push')
          if failures:
              raise SystemExit('Unsafe repository-writing workflow detected:\n'+'\n'.join(failures))
          print('Workflow write-safety check passed')
          PY

      - name: Core file references
        run: |
          python - <<'PY'
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          for required in ('app.js','app.css'):
              assert required in index, f'{required} is not referenced by index.html'
          print('Core file reference check passed')
          PY

      - name: Shared production loading invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index=Path('index.html').read_text(encoding='utf-8')
          app=Path('app.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          core=Path('app-core.js').read_text(encoding='utf-8')
          launch=Path('launch-experience.js').read_text(encoding='utf-8')
          perf=Path('performance-system.js').read_text(encoding='utf-8')
          partner=Path('partner-page-unified-v1503.js').read_text(encoding='utf-8')
          partner_exp=Path('partner-account-experience-v2.js').read_text(encoding='utf-8')
          chart=Path('chart-motion.js').read_text(encoding='utf-8')

          assert 'skeleton-motion-polish-v1512.css' in index
          app_build=re.search(r"\bvar\s+v='([^']+)'",app)
          sw_build=re.search(r"\bconst\s+BUILD='([^']+)'",sw)
          assert app_build and sw_build and app_build.group(1)==sw_build.group(1), 'app/SW build mismatch'
          assert "'./sales-calendar-layout-v1530.js'" in app and "'sales-calendar-layout-v1530.js'" in sw

          for name in (
              'main-page-loading-motion-v1506.js','main-page-truth-gate-v1507.js',
              'sales-loading-mask-v1508.js','sales-month-loading-v1509.js',
              'main-kpi-count-motion-v1510.js','skeleton-truth-exclusivity-v1511.js'
          ):
              assert f"'./{name}'" not in app, f'competing loader returned: {name}'

          for name in (
              'gesture-back-v31.js','gesture-native-v3.js','gesture-native-v3-actions.js',
              'gesture-live-tracking.js','interaction-system-v2.js','chart-gesture-v2.js'
          ):
              assert f"'./{name}'" not in app, f'experimental gesture module shipped live: {name}'

          for marker in ('rt-launch-brand','BRAND_TO_SKELETON_MS','retrade:motion-ready'):
              assert marker in launch, f'launch marker missing: {marker}'
          for marker in ('const _bootMonthlyRoute=','const _hydratedBootPage=','.rt-chart-primary-bar','__rtAuthHandoff'):
              assert marker in core, f'core marker missing: {marker}'
          assert 'rt-sales-route-v1' not in perf and 'restoreSalesState()' not in perf
          assert 'renderLoadingShell(a);' not in partner
          assert 'installPaintFirstNavigation();' not in partner_exp
          assert 'el.textContent=money(0' not in chart
          print('Shared loading invariants passed:',app_build.group(1))
          PY


      - name: Staging isolation and gesture boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app=Path('app.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          manifest=Path('staging-gestures.js').read_text(encoding='utf-8')
          cname=Path('CNAME').read_text(encoding='utf-8').strip()

          assert cname == 'test.retrade-uk.com', 'staging CNAME changed'
          assert "'./staging-supabase.js'" in app, 'staging Supabase binding missing'
          assert "'./staging-dev-auth.js'" in app, 'staging auth helper missing'
          assert "'./staging-gestures.js'" in app, 'gesture manifest entrypoint missing'
          assert 'window.__rtStagingGestureManifest' in manifest

          allowed=(
              'gesture-back-v31.js','gesture-native-v3.js','gesture-native-v3-actions.js',
              'gesture-live-tracking.js','interaction-system-v2.js','surface-gestures-v2.js',
              'chart-gesture-v2.js'
          )
          for name in allowed:
              assert name in manifest, f'gesture module missing from manifest: {name}'
              assert name in sw, f'gesture module missing from staging cache: {name}'
              assert f"'./{name}'" not in app, f'gesture module leaked directly into app.js: {name}'

          app_build=re.search(r"\bvar\s+v='([^']+)'",app)
          sw_build=re.search(r"\bconst\s+BUILD='([^']+)'",sw)
          assert app_build and sw_build and app_build.group(1)==sw_build.group(1)
          assert 'v1550-staging-g1' in app_build.group(1)
          print('Staging isolation/gesture boundary passed:',app_build.group(1))
          PY


      - name: Frame-zero launch and Dashboard filter invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          index=Path('index.html').read_text(encoding='utf-8')
          launch=Path('launch-experience.js').read_text(encoding='utf-8')
          core=Path('app-core.js').read_text(encoding='utf-8')

          plate=index.find('<div id="rt-launch-brand"')
          nav=index.find('<nav id="nav"')
          supabase=index.find('@supabase/supabase-js')
          app=index.find('<script src="./app.js')
          head=index.find('</head>')

          assert plate!=-1 and nav!=-1 and plate<nav
          assert 'rt-launch-first-frame-style' in index and 'rt-launch-sealed' in index and 'body::before' in index
          assert supabase!=-1 and app!=-1 and supabase<app and supabase>head
          assert "document.getElementById('rt-launch-brand')" in launch
          assert "!finishRequested&&b&&b.classList.contains('rt-real-layout-loading')" not in launch
          assert 'directRevealReady' in launch
          assert 'BRAND_MIN_MS=2050' in launch and 'BRAND_TO_SKELETON_MS=2150' in launch and 'SKELETON_MIN_MS=360' in launch and 'skeletonRemaining' in launch
          assert 'rtLaunchShieldArc1540' in index and 'rtLaunchWordReveal1540' in index

          start=core.find('function setSummaryPeriod(p)')
          end=core.find('\n}',start)
          block=core[start:end+2]
          assert start!=-1 and '_queueInteractionRender' not in block and 'setTimeout' not in block
          assert block.count('requestAnimationFrame') >= 2, 'Dashboard selector no longer gets a paint before heavy render'
          assert 'renderSummary();' in block and '_summaryPeriodRenderToken' in core
          assert "_existingGrid.replaceWith(_nextGrid)" in core and "_existingHeader" in core
          assert 'html.rt-launch-sealed body{visibility:hidden!important;overflow:hidden!important}' in index

          print('Frame-zero launch and Dashboard filter invariants passed')
          PY


      - name: Local filter responsiveness invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          core=Path('app-core.js').read_text(encoding='utf-8')
          names=(
              'setSummaryPeriod','setMonthlyPeriod','setMonthFilter','setMonthSort',
              'setStockSort','setStockFilter','setStockSourcedFilter','setStockStateFilter',
              'toggleStockGrouped','_scheduleCashflowResultsUpdate'
          )
          for name in names:
              start=core.find('function '+name+'(')
              assert start!=-1, f'{name} missing'
              nxt=core.find('\nfunction ',start+10)
              block=core[start:nxt if nxt!=-1 else start+2500]
              assert '_queueInteractionRender' not in block, f'{name} is artificially deferred again'
          print('Local filter responsiveness invariants passed')
          PY


      - name: Dashboard truthful-value invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          core=Path('app-core.js').read_text(encoding='utf-8')
          start=core.find('function renderSummary()')
          end=core.find('\n// monthKey',start)
          assert start!=-1 and end!=-1
          block=core[start:end]
          assert '_animateKPIs(el);' not in block, 'Dashboard is replacing truthful values with a post-render count-up again'
          assert '_animateDonut(el, SUMMARY_PERIOD);' in block, 'Dashboard explanatory motion unexpectedly disappeared'
          print('Dashboard truthful-value invariant passed')
          PY


      - name: iOS startup and Sales period responsiveness invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          index=Path('index.html').read_text(encoding='utf-8')
          core=Path('app-core.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')

          for name in (
              'launch-light-1170x2532.png','launch-dark-1170x2532.png',
              'launch-light-1179x2556.png','launch-dark-1179x2556.png',
              'launch-light-1206x2622.png','launch-dark-1206x2622.png',
              'launch-light-1284x2778.png','launch-dark-1284x2778.png',
              'launch-light-1290x2796.png','launch-dark-1290x2796.png',
              'launch-light-1320x2868.png','launch-dark-1320x2868.png'
          ):
              assert name in index, f'iOS startup link missing: {name}'
              assert name in sw, f'iOS startup asset not cached: {name}'
              assert Path(name).exists(), f'iOS startup asset file missing: {name}'

          start=core.find('function setMonthlyPeriod(v)')
          end=core.find('\n}',start)
          block=core[start:end+2]
          assert start!=-1 and block.count('requestAnimationFrame')>=2
          assert '_monthlyPeriodRenderToken' in core
          assert "if(MONTHLY_VIEW==='grid')renderMonthlyGrid();" in block
          print('iOS startup and Sales period responsiveness invariants passed')
          PY


      - name: Local Inventory and month-filter responsiveness invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          core=Path('app-core.js').read_text(encoding='utf-8')

          assert 'function _queueLocalControlRender(key,fn)' in core
          assert "_queueLocalControlRender('stock-filter'" in core
          assert "_queueLocalControlRender('month-detail-filter'" in core
          assert 'data-stock-state=' in core
          assert 'data-stock-filter=' in core
          assert 'data-stock-sourced-filter=' in core
          assert 'data-month-filter=' in core

          for fn in ('setStockSort','setStockFilter','setStockSourcedFilter','setStockStateFilter','setMonthFilter','setMonthSort'):
              start=core.find('function '+fn+'(')
              assert start!=-1, fn+' missing'
              end=core.find('\n}',start)
              block=core[start:end+2]
              assert 'renderStock();' not in block and 'renderMonth();' not in block, fn+' blocks input with synchronous full render'
          print('Local Inventory and month-filter responsiveness invariants passed')
          PY


      - name: Sales disclosure locality invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          core=Path('app-core.js').read_text(encoding='utf-8')
          start=core.find('function toggleFYSection(fyStart)')
          end=core.find('\n}',start)
          block=core[start:end+2]
          assert start!=-1
          assert 'data-fy-section' in core and 'data-fy-grid' in core and 'data-fy-chevron' in core
          assert "if(!next)renderMonthlyGrid();" in block, 'lazy first expansion fallback missing'
          assert "grid.style.display='none'" in block and "grid.style.display='grid'" in block
          pick=core[core.find('function pickMonth(m)'):core.find('\n}',core.find('function pickMonth(m)'))+2]
          assert "_queueLocalControlRender('month-pick'" in pick and 'renderMonth();' in pick
          print('Sales disclosure locality invariants passed')
          PY


      - name: Single skeleton motion owner invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('skeleton-motion-polish-v1512.css').read_text(encoding='utf-8')
          start=css.find('.rt .skeleton,')
          end=css.find('}',start)
          block=css[start:end+1]
          assert 'animation:none!important' in block, 'legacy base skeleton animation still runs under calm sheen'
          assert 'rtSkeletonSheen1512 var(--rt-skel-bar-duration)' in css
          assert '--rt-skel-bar-duration:3.65s' in css
          print('Single skeleton motion owner invariant passed')
          PY


      - name: Stable Activity and Expenses control invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          core=Path('app-core.js').read_text(encoding='utf-8')

          for marker in (
              'function clearActivitySearch()',
              "data-activity-filter",
              "const existing=el.querySelector('.act-shell')",
              "document.activeElement!==input",
              "data-cost-period",
              "data-cost-category",
              "function _queueExpensesRender()"
          ):
              assert marker in core, marker+' missing'

          for fn in ('setActivityFilter','setActivitySearch','setCostPeriod','setCostCatFilter'):
              start=core.find('function '+fn+'(')
              end=core.find('\n}',start)
              block=core[start:end+2]
              assert start!=-1
              assert 'renderActivity();' not in block and 'renderExpenses();' not in block, fn+' synchronously rebuilds page'

          print('Stable Activity and Expenses control invariants passed')
          PY
