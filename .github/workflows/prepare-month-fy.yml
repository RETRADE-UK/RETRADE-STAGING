name: Validate expense months and net reconciliation
on:
  push:
    branches: [fix/month-groups-fy-reconciliation]
    paths:
      - .github/workflows/prepare-month-fy.yml
      - scripts/prepare-month-fy.py
      - tests/cost-months-performance-browser.cjs
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact scoped changes
        run: python3 scripts/prepare-month-fy.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Isolated desktop and mobile regression
        env:
          RETRADE_CAPTURE: /tmp/retrade-capture
        run: |
          node tests/cost-months-performance-browser.cjs
          node tests/costs-browser.cjs
          node tests/tax-browser.cjs
          node tests/dashboard-chart-browser.cjs
      - run: npm run build
      - name: Commit validated source and remove temporary tooling
        run: |
          rm scripts/prepare-month-fy.py .github/workflows/prepare-month-fy.yml .github/workflows/review-month-groups.yml
          git add src/core/application.js assets/styles/workspaces.css config/assets.js index.html package.json tests/cost-months-performance-browser.cjs docs/releases/cost-months-net-margin-2026-10-13.md scripts/prepare-month-fy.py .github/workflows/prepare-month-fy.yml .github/workflows/review-month-groups.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: collapsible expense months and reconciled FY net margin'
          git push origin HEAD:fix/month-groups-fy-reconciliation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expense-months-net-reconciliation
          path: /tmp/retrade-capture
          retention-days: 2
          if-no-files-found: warn
